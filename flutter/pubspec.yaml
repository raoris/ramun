name: alsefa
description: Alsefa Physiotherapy Center cross-platform app
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  pointycastle: ^3.9.1
  shared_preferences: ^2.3.3
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  file_picker: ^10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_config.json
