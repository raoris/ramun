name: Build and Release Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION_NAME: 1.0.${{ github.run_number }}
  RELEASE_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Generate release signing key
        run: |
          mkdir -p "$RUNNER_TEMP/ramun-keystore"
          KEYSTORE="$RUNNER_TEMP/ramun-keystore/ramun.jks"
          STORE_PASS=$(openssl rand -hex 24)
          KEY_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias ramun \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ramun, OU=Mobile, O=Ramun, L=Unknown, ST=Unknown, C=US"
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_PASSWORD=$KEY_PASS"
            echo "KEY_ALIAS=ramun"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ramun-apk-${{ env.RELEASE_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Ramun ${{ env.RELEASE_VERSION_NAME }}
          body: |
            Signed release APK built from `${{ github.sha }}`.
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
